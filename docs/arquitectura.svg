<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="box-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="engine-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#062817"/>
      <stop offset="100%" stop-color="#04180e"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="540" fill="url(#bg-grad)" rx="12"/>
  <rect width="956" height="536" x="2" y="2" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1" rx="10"/>

  <!-- Title & Banner -->
  <text x="480" y="42" text-anchor="middle" fill="#f8fafc" font-size="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="800" letter-spacing="1">
    ARQUITECTURA SERVERLESS AWS · NODEZERO
  </text>
  <text x="480" y="66" text-anchor="middle" fill="#38bdf8" font-size="12" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600">
    Comité de Contención Epidemiológica · ULEAM Track B (Costo Operativo $0.00 / Free Tier)
  </text>

  <!-- User / Alcaldía Node -->
  <g transform="translate(50, 190)">
    <rect width="145" height="110" rx="8" fill="url(#box-grad)" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="72" cy="38" r="18" fill="rgba(56,189,248,0.2)" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="72" y="44" text-anchor="middle" font-size="20">👨‍💻</text>
    <text x="72" y="74" text-anchor="middle" fill="#f8fafc" font-size="12" font-family="sans-serif" font-weight="700">Usuario / Alcaldía</text>
    <text x="72" y="90" text-anchor="middle" fill="#94a3b8" font-size="9.5" font-family="sans-serif">Navegador Web</text>
    <text x="72" y="102" text-anchor="middle" fill="#64748b" font-size="8.5" font-family="sans-serif">Terminal Táctico Pip-Boy</text>
  </g>

  <!-- Connection: User -> CloudFront -->
  <line x1="195" y1="245" x2="265" y2="245" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 2"/>
  <polygon points="265,241 273,245 265,249" fill="#38bdf8"/>
  <text x="230" y="235" text-anchor="middle" fill="#94a3b8" font-size="9" font-family="sans-serif">HTTPS</text>

  <!-- Amazon CloudFront Node -->
  <g transform="translate(275, 185)">
    <rect width="165" height="120" rx="8" fill="url(#box-grad)" stroke="#FF9900" stroke-width="2"/>
    <text x="82" y="34" text-anchor="middle" font-size="22">🌐</text>
    <text x="82" y="58" text-anchor="middle" fill="#f8fafc" font-size="13" font-family="sans-serif" font-weight="700">Amazon CloudFront</text>
    <text x="82" y="76" text-anchor="middle" fill="#FF9900" font-size="10.5" font-family="sans-serif" font-weight="600">CDN &amp; SSL Global</text>
    <text x="82" y="93" text-anchor="middle" fill="#cbd5e1" font-size="9" font-family="sans-serif">Caché en Edge Locations</text>
    <text x="82" y="107" text-anchor="middle" fill="#64748b" font-size="8.5" font-family="sans-serif">Protección DDoS &amp; HTTP/3</text>
  </g>

  <!-- Connection: CloudFront -> S3 Bucket -->
  <line x1="440" y1="245" x2="500" y2="245" stroke="#10b981" stroke-width="2"/>
  <polygon points="500,241 508,245 500,249" fill="#10b981"/>
  <text x="472" y="235" text-anchor="middle" fill="#94a3b8" font-size="9" font-family="sans-serif">Origen S3</text>

  <!-- Amazon S3 Bucket Node -->
  <g transform="translate(510, 185)">
    <rect width="170" height="120" rx="8" fill="url(#box-grad)" stroke="#10b981" stroke-width="2"/>
    <text x="85" y="34" text-anchor="middle" font-size="22">🪣</text>
    <text x="85" y="58" text-anchor="middle" fill="#f8fafc" font-size="13" font-family="sans-serif" font-weight="700">Amazon S3 Bucket</text>
    <text x="85" y="76" text-anchor="middle" fill="#10b981" font-size="10.5" font-family="sans-serif" font-weight="600">Hosting Estático SPA</text>
    <text x="85" y="93" text-anchor="middle" fill="#cbd5e1" font-size="9" font-family="sans-serif">Bundle React 19 + Vite</text>
    <text x="85" y="107" text-anchor="middle" fill="#64748b" font-size="8.5" font-family="sans-serif">HTML5 / JS / CSS (~1.2 MB)</text>
  </g>

  <!-- Connection: S3 / CloudFront -> Client Execution Engine -->
  <line x1="680" y1="245" x2="725" y2="245" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3 3"/>
  <polygon points="725,241 733,245 725,249" fill="#38bdf8"/>
  <text x="704" y="235" text-anchor="middle" fill="#94a3b8" font-size="8.5" font-family="sans-serif">Ejecuta</text>

  <!-- Client-Side Engine Node -->
  <g transform="translate(735, 145)">
    <rect width="185" height="200" rx="8" fill="url(#engine-grad)" stroke="#10b981" stroke-width="2" filter="url(#glow)"/>
    <text x="92" y="30" text-anchor="middle" font-size="20">⚡</text>
    <text x="92" y="52" text-anchor="middle" fill="#f8fafc" font-size="12" font-family="sans-serif" font-weight="800">Motor Epidemiológico</text>
    <text x="92" y="68" text-anchor="middle" fill="#38bdf8" font-size="9.5" font-family="sans-serif" font-weight="700">Client-Side Serverless</text>
    <line x1="15" y1="78" x2="170" y2="78" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    
    <text x="92" y="96" text-anchor="middle" fill="#cbd5e1" font-size="9" font-family="sans-serif">🔹 Modelo SEIR sobre Grafo Manta</text>
    <text x="92" y="114" text-anchor="middle" fill="#cbd5e1" font-size="9" font-family="sans-serif">🔹 Vacunación en Anillo + Hubs</text>
    <text x="92" y="132" text-anchor="middle" fill="#cbd5e1" font-size="9" font-family="sans-serif">🔹 Monte Carlo (Mulberry32)</text>
    <text x="92" y="150" text-anchor="middle" fill="#cbd5e1" font-size="9" font-family="sans-serif">🔹 Brotes Sorpresa en Vivo</text>
    <text x="92" y="168" text-anchor="middle" fill="#cbd5e1" font-size="9" font-family="sans-serif">🔹 Informe Táctico Alcaldía</text>
    
    <text x="92" y="188" text-anchor="middle" fill="#10b981" font-size="8.5" font-family="sans-serif" font-weight="700">0 Cold Starts · 100% Offline</text>
  </g>

  <!-- Monitoring & AWS Budgets Banner -->
  <g transform="translate(70, 445)">
    <rect width="820" height="60" rx="8" fill="rgba(15,23,42,0.92)" stroke="rgba(56,189,248,0.3)" stroke-width="1.2"/>
    <text x="35" y="35" font-size="20">🛡️</text>
    
    <text x="65" y="27" fill="#f8fafc" font-size="11.5" font-family="sans-serif" font-weight="700">
      AWS Budgets &amp; Monitoreo FinOps:
    </text>
    <text x="280" y="27" fill="#10b981" font-size="11.5" font-family="sans-serif" font-weight="700">
      Presupuesto de $5.00 USD con 3 Alertas (50% [$2.50], 80% [$4.00], 100% [$5.00])
    </text>
    
    <text x="65" y="47" fill="#94a3b8" font-size="9.5" font-family="sans-serif">
      Región: <tspan fill="#38bdf8">us-east-1</tspan> · Costo mensual estimado: <tspan fill="#10b981">$0.00 USD / mes (100% Free Tier)</tspan> · Gasto real: <tspan fill="#10b981">&lt; $0.01 USD</tspan> · Sin servidores ni credenciales expuestas
    </text>
  </g>
</svg>