<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <radialGradient id="nodezero-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1aff74" stop-opacity="0.35" />
      <stop offset="85%" stop-color="#020804" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#000000" stop-opacity="1" />
    </radialGradient>
    <filter id="badge-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fondo táctico redondeado militar -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#nodezero-glow)" stroke="#1aff74" stroke-width="2.5" />
  
  <!-- Retículas angulares de encuadre en esquinas -->
  <path d="M 8 16 L 8 8 L 16 8" stroke="#1aff74" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 48 8 L 56 8 L 56 16" stroke="#1aff74" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 56 48 L 56 56 L 48 56" stroke="#1aff74" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 16 56 L 8 56 L 8 48" stroke="#1aff74" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Anillo de radar táctico central -->
  <circle cx="32" cy="32" r="19" stroke="#1aff74" stroke-width="1.5" stroke-dasharray="4 2.5" opacity="0.65" />
  <circle cx="32" cy="32" r="10" stroke="#ff3333" stroke-width="1.8" opacity="0.85" />

  <!-- Símbolo Biohazard Táctico / Plaga Zombie -->
  <g filter="url(#badge-glow)" stroke="#1aff74" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Centro del biohazard -->
    <circle cx="32" cy="32" r="3.2" fill="#ff3333" stroke="#ffffff" stroke-width="1.2" />
    
    <!-- 3 lóbulo de contención biológica -->
    <!-- Superior -->
    <path d="M 27 24 C 27 18 37 18 37 24" />
    <path d="M 32 15 L 32 21" stroke="#ff3333" stroke-width="2" />
    
    <!-- Inferior Izquierdo -->
    <path d="M 22 34 C 18 39 25 46 30 43" />
    <path d="M 19 40 L 24 36" stroke="#ff3333" stroke-width="2" />
    
    <!-- Inferior Derecho -->
    <path d="M 42 34 C 46 39 39 46 34 43" />
    <path d="M 45 40 L 40 36" stroke="#ff3333" stroke-width="2" />
  </g>

  <!-- Puntos cardinales del radar -->
  <circle cx="32" cy="7" r="1.5" fill="#1aff74" />
  <circle cx="57" cy="32" r="1.5" fill="#1aff74" />
  <circle cx="32" cy="57" r="1.5" fill="#1aff74" />
  <circle cx="7" cy="32" r="1.5" fill="#1aff74" />
</svg>