<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="box-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="aws-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9900"/>
      <stop offset="100%" stop-color="#E87C00"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="540" fill="url(#bg-grad)" rx="12"/>
  <rect width="956" height="536" x="2" y="2" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1" rx="10"/>

  <!-- Title & Banner -->
  <text x="480" y="45" text-anchor="middle" fill="#f8fafc" font-size="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="800" letter-spacing="1">
    ARQUITECTURA SERVERLESS AWS · NODEZERO
  </text>
  <text x="480" y="70" text-anchor="middle" fill="#38bdf8" font-size="12" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600">
    Comité de Contención Epidemiológica · ULEAM Track B (Costo Operativo ~$0.00 / Free Tier)
  </text>

  <!-- User / Jurado Node -->
  <g transform="translate(60, 210)">
    <rect width="130" height="90" rx="8" fill="url(#box-grad)" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="65" cy="35" r="16" fill="rgba(56,189,248,0.2)" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="65" y="40" text-anchor="middle" font-size="18">👨‍💻</text>
    <text x="65" y="68" text-anchor="middle" fill="#f8fafc" font-size="11" font-family="sans-serif" font-weight="700">Jurado / Alcaldía</text>
    <text x="65" y="82" text-anchor="middle" fill="#94a3b8" font-size="9" font-family="sans-serif">Navegador Web</text>
  </g>

  <!-- Connection: User -> CloudFront -->
  <line x1="190" y1="255" x2="250" y2="255" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 2"/>
  <polygon points="250,251 258,255 250,259" fill="#38bdf8"/>
  <text x="220" y="245" text-anchor="middle" fill="#94a3b8" font-size="9" font-family="sans-serif">HTTPS</text>

  <!-- CloudFront Node -->
  <g transform="translate(260, 205)">
    <rect width="140" height="100" rx="8" fill="url(#box-grad)" stroke="#FF9900" stroke-width="2"/>
    <text x="70" y="32" text-anchor="middle" font-size="18">🌐</text>
    <text x="70" y="55" text-anchor="middle" fill="#f8fafc" font-size="12" font-family="sans-serif" font-weight="700">Amazon CloudFront</text>
    <text x="70" y="72" text-anchor="middle" fill="#FF9900" font-size="10" font-family="sans-serif">CDN &amp; SSL Global</text>
    <text x="70" y="88" text-anchor="middle" fill="#64748b" font-size="9" font-family="sans-serif">Caché &amp; Seguridad DDoS</text>
  </g>

  <!-- Split lines: CloudFront -> S3 (up) and CloudFront -> API Gateway (down) -->
  <!-- Line to S3 -->
  <path d="M 400,230 L 460,230 L 460,150 L 485,150" fill="none" stroke="#38bdf8" stroke-width="2"/>
  <polygon points="485,146 493,150 485,154" fill="#38bdf8"/>
  <text x="440" y="142" text-anchor="middle" fill="#94a3b8" font-size="9" font-family="sans-serif">Static SPA</text>

  <!-- S3 Node -->
  <g transform="translate(495, 105)">
    <rect width="150" height="90" rx="8" fill="url(#box-grad)" stroke="#10b981" stroke-width="1.5"/>
    <text x="75" y="32" text-anchor="middle" font-size="18">🪣</text>
    <text x="75" y="55" text-anchor="middle" fill="#f8fafc" font-size="12" font-family="sans-serif" font-weight="700">Amazon S3 Bucket</text>
    <text x="75" y="72" text-anchor="middle" fill="#10b981" font-size="10" font-family="sans-serif">React + Vite Frontend</text>
    <text x="75" y="86" text-anchor="middle" fill="#64748b" font-size="9" font-family="sans-serif">HTML / CSS / JS</text>
  </g>

  <!-- Line to API Gateway -->
  <path d="M 400,270 L 460,270 L 460,340 L 485,340" fill="none" stroke="#f59e0b" stroke-width="2"/>
  <polygon points="485,336 493,340 485,344" fill="#f59e0b"/>
  <text x="440" y="355" text-anchor="middle" fill="#94a3b8" font-size="9" font-family="sans-serif">REST API</text>

  <!-- API Gateway Node -->
  <g transform="translate(495, 295)">
    <rect width="150" height="90" rx="8" fill="url(#box-grad)" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="75" y="32" text-anchor="middle" font-size="18">⚡</text>
    <text x="75" y="55" text-anchor="middle" fill="#f8fafc" font-size="12" font-family="sans-serif" font-weight="700">Amazon API Gateway</text>
    <text x="75" y="72" text-anchor="middle" fill="#f59e0b" font-size="10" font-family="sans-serif">HTTP API v2</text>
    <text x="75" y="86" text-anchor="middle" fill="#64748b" font-size="9" font-family="sans-serif">CORS &amp; Throttling</text>
  </g>

  <!-- Line: API Gateway -> Lambda -->
  <line x1="645" y1="340" x2="695" y2="340" stroke="#f59e0b" stroke-width="2"/>
  <polygon points="695,336 703,340 695,344" fill="#f59e0b"/>

  <!-- AWS Lambda Node -->
  <g transform="translate(705, 275)">
    <rect width="195" height="130" rx="8" fill="url(#box-grad)" stroke="#FF9900" stroke-width="2" filter="url(#glow)"/>
    <text x="97" y="30" text-anchor="middle" font-size="18">λ</text>
    <text x="97" y="52" text-anchor="middle" fill="#f8fafc" font-size="13" font-family="sans-serif" font-weight="800">AWS Lambda</text>
    <text x="97" y="70" text-anchor="middle" fill="#FF9900" font-size="11" font-family="sans-serif" font-weight="700">Python 3.14 + Mangum</text>
    <text x="97" y="88" text-anchor="middle" fill="#38bdf8" font-size="10" font-family="sans-serif">FastAPI · NetworkX · NumPy</text>
    <text x="97" y="104" text-anchor="middle" fill="#94a3b8" font-size="9" font-family="sans-serif">Modelo SEIR sobre Grafo Manta</text>
    <text x="97" y="118" text-anchor="middle" fill="#10b981" font-size="9" font-family="sans-serif">Monte Carlo determinista</text>
  </g>

  <!-- Line: Lambda -> Bedrock -->
  <path d="M 802,275 L 802,205" fill="none" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="3 3"/>
  <polygon points="798,205 802,197 806,205" fill="#8b5cf6"/>

  <!-- Amazon Bedrock Node -->
  <g transform="translate(710, 115)">
    <rect width="185" height="80" rx="8" fill="url(#box-grad)" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="92" y="28" text-anchor="middle" font-size="16">🧠</text>
    <text x="92" y="48" text-anchor="middle" fill="#f8fafc" font-size="12" font-family="sans-serif" font-weight="700">Amazon Bedrock</text>
    <text x="92" y="64" text-anchor="middle" fill="#c4b5fd" font-size="10" font-family="sans-serif">Claude 3 Haiku / Titan</text>
    <text x="92" y="76" text-anchor="middle" fill="#94a3b8" font-size="8.5" font-family="sans-serif">Informe para el Alcalde (Nivel Pro)</text>
  </g>

  <!-- Monitoring & Budget Footer Banner -->
  <g transform="translate(140, 465)">
    <rect width="680" height="48" rx="8" fill="rgba(15,23,42,0.9)" stroke="rgba(56,189,248,0.3)" stroke-width="1"/>
    <text x="35" y="28" font-size="16">🛡️</text>
    <text x="60" y="24" fill="#f8fafc" font-size="11" font-family="sans-serif" font-weight="700">
      AWS Budgets &amp; CloudWatch:
    </text>
    <text x="215" y="24" fill="#10b981" font-size="11" font-family="sans-serif" font-weight="600">
      Presupuesto de $5.00 USD con alarma activa al 80% ($4.00)
    </text>
    <text x="60" y="40" fill="#94a3b8" font-size="9" font-family="sans-serif">
      Región: us-east-1 · Principio de Menor Privilegio (IAM Least Privilege) · Sin credenciales expuestas
    </text>
  </g>
</svg>
